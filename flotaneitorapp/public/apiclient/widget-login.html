<div id="widget-login">
    <div id="login-messages">
    </div>
    <h2>Iniciar Sesión</h2>
    <div class="form-group">
        <label class="control-label col-sm-2" for="email">Email:</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" name="email"
                   placeholder="email" id="email" />
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-2" for="password">Password:</label>
        <div class="col-sm-10">
            <input type="password" class="form-control" name="password"
                   placeholder="contraseña" id="password"/>
        </div>
    </div>
    <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
            <button class="btn btn-primary" type="button" id="boton-login">Aceptar</button>
        </div>
    </div>
</div>

<script>
    window.history.pushState("", "", "/apiclient/client.html?w=login");

    /**
     * Gestiona el envío del formulario de login, asignando un token a la sesión en caso de inicio de
     * sesión exitoso o mostrando los errores en caso de inicio de sesión fallido
     */
    $("#boton-login").click(function() {
        $.ajax({
            url: URLbase + "/users/login",
            type: "POST",
            data: {
                email:$("#email").val(),
                password:$("#password").val()
            },
            dataType: "json",
            success: function (response){
                token = response.token;
                successMessage = response.msg;
                Cookies.set('token', token);
                var msgDiv = $("#login-messages")
                // Se vacía la lista de mensajes
                msgDiv.empty().append(`
                    <div class="alert alert-success" role="alert">
                        ${successMessage}
                    </div>
                `)
                setTimeout(() => {
                    $("#main-container").load("widget-vehicles-list.html");
                }, 1000)
            },
            error: function (error) {
                Cookies.remove('token');
                var errorsDiv = $("#login-messages")
                // Se vacía la lista de errores
                errorsDiv.empty().append(`
                    <div class="alert alert-danger" role="alert">
                        <ul id="errors-list"></ul>
                    </div>
                `)
                // Se añaden los errores a la lista de errores
                let errors = error.responseJSON.errors;
                errors.forEach(err => {
                    $("#errors-list").append(`<li>${err.msg}</li>`);
                });
            }
        })
    })
</script>
