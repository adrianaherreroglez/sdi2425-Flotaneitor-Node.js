<div id="widget-vehicle-trips" class="container mt-4">
    <div id="vehicle-trips-list-messages">
    </div>
    <h2 class="mb-4 text-primary" id="vehicle-trips-title">Trayectos</h2>
    <div class="form-group">
        <label for="vehicleSelect">Selecciona un vehículo</label>
        <select class="form-control" id="vehicleSelect">
            <!-- Aquí se insertarán las mátriculas de los coches -->
        </select>
    </div>

    <table id="vehicle-trips-list" class="table table-striped table-bordered">
        <!-- Aquí se insertarán los trayectos dinámicamente -->
    </table>
</div>
<script>
    (function () {
        window.history.pushState("", "", "/apiclient/client.html?w=vehicleTrips");
        let allVehicles
        const selector = $("#vehicleSelect");
        let selectedVehicleTrip

        /**
         * Obtiene todos los vehículos de la base de datos y rellena con ellos el select del HTML
         * @returns {Promise<unknown>} promesa que permite que la función pueda ser llamada asíncronamente
         */
        function getVehicles() {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: URLbase + "/vehicles/all",
                    type: "GET",
                    dataType: 'json',
                    headers: { "token": token },
                    success: function (response) {
                        allVehicles = response.vehicles;
                        fillUpVehicleSelector(allVehicles);
                        resolve(); // Resolvemos la promesa
                    },
                    error: function (error) {
                        const errorsDiv = $('#vehicle-trips-list-messages');
                        let err = error.responseJSON.error;
                        errorsDiv.empty().append(`
                    <div class="alert alert-danger" role="alert">
                        <p>${err}</p>
                    </div>
                `);
                        reject(error); // Rechazo si hay error
                    }
                });
            });
        }

        /**
         * Rellena el select del html con las matrículas de los vehículos recibidos como parámetro
         * @param vehicles vehículos cuyas matrículas se quieren incluir en el select
         */
        function fillUpVehicleSelector(vehicles) {
            // Vaciar el selector
            selector.empty()
            // Rellenar el selector
            vehicles.forEach(vehicle => {
                selector.append(`
                <option value="${vehicle._id}">${vehicle.plate}</option>
            `)
            })
            // Se le asigna el evento de selección
            selector.on("change", function () {
                const selectedIndex = this.selectedIndex;
                const selectedVehicle = allVehicles[selectedIndex];
                getVehicleTrips(selectedVehicle);

                $("#vehicle-trips-title").text("Trayectos - " + selectedVehicle.plate);
            });

        }

        /**
         * Obtiene los trayectos realizados por el vehículo que se le introduce como parámetro
         * @param vehicle vehículo del que se quieren obtener los trayectos
         */
        function getVehicleTrips(vehicle) {
            $.ajax({
                url: URLbase + "/vehicles/trips/" + vehicle._id,
                type: "GET",
                data: {},
                dataType: 'json',
                headers: {"token": token},
                success: function (response) {
                    const trips = response.trips;
                    updateTripsList(trips);
                },
                error: function (error) {
                    const errorsDiv = $('#vehicle-trips-list-messages')
                    // Se obtiene el error
                    let err = error.responseJSON.error;
                    // Se vacía la lista de errores y se añade el error
                    errorsDiv.empty().append(`
                    <div class="alert alert-danger" role="alert">
                        <p>${err}</p>
                    </div>
                `)
                }
            })
        }

        /**
         * Muestra los trayectos en forma de tabla en el HTML
         * @param trips trayectos a mostrar
         */
        function updateTripsList(trips) {
            const table = $("#vehicle-trips-list");
            table.empty();

            // Si no hay trayectos
            if (!trips || trips.length === 0) {
                table.append(`
                <tr><td colspan="5" class="text-center text-muted">No hay trayectos para este vehículo.</td></tr>
            `);
                return;
            }

            // Cabecera
            table.append(`
            <thead>
                <tr>
                    <th>#</th>
                    <th>Empleado</th>
                    <th>Inicio</th>
                    <th>Odómetro Inicial</th>
                    <th>Odómetro Final</th>
                    <th>Duración</th>
                </tr>
            </thead>
            <tbody></tbody>
        `);

            const tbody = table.find("tbody");

            // Se añaden los trayectos a la tabla
            trips.forEach((trip, index) => {
                const start = new Date(trip.startDateTime).toLocaleString();
                const employee = trip.dni ?? "<span class='text-muted'>Desconocido</span>"
                const odoStart = trip.startingOdometer ?? "-";
                const odoEnd = trip.endingOdometer ?? "<span class='text-muted'>En curso</span>";
                const duration = trip.duration ?? "<span class='text-muted'>-</span>";
                const formattedDuration = formatTripsDuration(duration)

                tbody.append(`
                <tr>
                    <td>${index + 1}</td>
                    <td>${employee}</td>
                    <td>${start}</td>
                    <td>${odoStart.toLocaleString()} km</td>
                    <td>${typeof odoEnd === "string" ? odoEnd : odoEnd.toLocaleString() + " km"}</td>
                    <td>${formattedDuration}</td>
                </tr>
            `);
            });
        }

        (async () => {
            await getVehicles()

            // Si no hay trip especificado, se selecciona el primero de la lista
            if (typeof appState.tripSelectedVehicle === "undefined") {
                selectedVehicleTrip = allVehicles[0]
            } else {
                selectedVehicleTrip = appState.tripSelectedVehicle
            }

            selector.val(selectedVehicleTrip._id);
            selector.change()
        })();
    })();

</script>
